; ESP32 Macro Keypad
;   pio run -e firmware -t upload -t monitor   -> the real firmware
;   pio run -e hwtest   -t upload -t monitor   -> hardware test (keys + encoder)

[platformio]
default_envs = firmware

[env]
; 6.x = arduino-esp32 2.0.x (Bluedroid BLE, which hid.cpp uses)
platform = espressif32 @ ^6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -Wall

[env:firmware]
build_src_filter = +<*> -<hwtest/>
; BLE alone is ~1.1 MB; the default 1.25 MB app slot won't fit BLE + e-paper.
; huge_app = 3 MB app, no OTA.
board_build.partitions = huge_app.csv
lib_deps =
    zinggjm/GxEPD2 @ ^1.6.0

[env:hwtest]
; Reuses the real input drivers so the test exercises the same code the firmware runs.
build_src_filter = +<input.cpp> +<hwtest/>
